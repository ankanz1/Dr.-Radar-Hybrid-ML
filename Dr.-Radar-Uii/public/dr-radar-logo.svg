<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Dr. Radar Official Brand Logo -->
  <defs>
    <!-- Clip path to keep radar cone and elements within the outer circle -->
    <clipPath id="dr-radar-circle-clip">
      <circle cx="250" cy="250" r="213" />
    </clipPath>
  </defs>

  <!-- Background Circle (Inner Canvas) -->
  <circle cx="250" cy="250" r="213" fill="#f7f8fa" />

  <!-- Radar Scan Cone (Top Sector) -->
  <g clip-path="url(#dr-radar-circle-clip)">
    <!-- Translucent Radar Beam Sector -->
    <polygon points="250,250 192,30 308,30" fill="#f87171" fill-opacity="0.22" />
    
    <!-- Vertical Radar Sweep Line -->
    <line x1="250" y1="252" x2="250" y2="94" stroke="#bc000a" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Inner Concentric Ring -->
  <circle cx="250" cy="250" r="166" stroke="#94a3b8" stroke-width="3.5" fill="none" opacity="0.9" />

  <!-- Outer Main Ring -->
  <circle cx="250" cy="250" r="213" stroke="#1e2329" stroke-width="12" fill="none" />

  <!-- Target Radar Blip / Pulse Halo -->
  <g id="radar-blip">
    <!-- Outer Soft Pink Halo -->
    <circle cx="250" cy="116" r="22" fill="#ef4444" fill-opacity="0.28" />
    <!-- White Gap Ring -->
    <circle cx="250" cy="116" r="9.5" fill="#ffffff" />
    <!-- Center Red Target Blip -->
    <circle cx="250" cy="116" r="6.5" fill="#bc000a" />
  </g>

  <!-- ECG Waveform (P-QRS-T) with Elevated R-Peak -->
  <path
    d="M 104 250
       L 156 250
       L 174 238
       L 190 250
       L 214 250
       L 223 268
       L 250 128
       L 277 268
       L 286 250
       L 310 250
       L 332 230
       L 352 250
       L 396 250"
    stroke="#181b20"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
